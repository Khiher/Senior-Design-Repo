; PlatformIO project for NUCLEO-L152RE chip controller (DAC bias, PI stepping, EOM counting, serial commands)
[env:nucleo_l152re]
platform = ststm32
board = nucleo_l152re
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags = -Wall
; Default GCC 7.2.1 is x86-only; this one has a native Apple Silicon build
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
