; PlatformIO project for NUCLEO-L152RE driving a TI DAC756x/DAC816x/DAC856x over SPI
[env:nucleo_l152re]
platform = ststm32
board = nucleo_l152re
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags = -Wall
; Default GCC 7.2.1 is x86-only; this one has a native Apple Silicon build
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
